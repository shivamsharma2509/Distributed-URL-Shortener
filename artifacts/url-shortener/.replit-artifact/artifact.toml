kind = "web"
previewPath = "/"
title = "Distributed URL Shortener"
description = "A portfolio-grade URL shortening platform with fast redirects, URL management, click analytics, Redis-backed caching, and a polished React dashboard for developers and teams."
version = "1.0.0"
id = "artifacts/url-shortener"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21875

[services.development]
run = "pnpm --filter @workspace/url-shortener run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/url-shortener", "run", "build" ]
serve = "static"
publicDir = "artifacts/url-shortener/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21875"
BASE_PATH = "/"
