spring.application.name=shortstack-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never

# Accept the existing postgresql:// convention while allowing JDBC_DATABASE_URL
# to override it when a JDBC-prefixed URL is already available.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:${DATABASE_URL}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

shortstack.cache-ttl-seconds=${REDIS_CACHE_TTL_SECONDS:3600}
shortstack.create-rate-limit=${CREATE_RATE_LIMIT:30}
shortstack.short-url-base-url=${SHORT_URL_BASE_URL:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
logging.level.com.shortstack=INFO